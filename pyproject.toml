[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vivareal-research"
version = "0.1.0"
description = "Central rental research MCP module for Viva Real (Grupo OLX)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vivareal_research"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
markers = [
    "integration: marks tests as live integration tests",
]
